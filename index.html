
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Be My Valentine?</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      margin: 0;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .font-script {
      font-family: 'Dancing Script', cursive;
    }
    @keyframes float {
      0% { transform: translateY(0px) translateX(0px) rotate(0deg); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(-100vh) translateX(20px) rotate(360deg); opacity: 0; }
    }
    .heart {
      position: absolute;
      bottom: -100px;
      animation: float linear infinite;
      pointer-events: none;
    }
    @keyframes confetti-fall {
      0% { transform: translateY(-20vh) translateX(0) rotate(0deg); opacity: 1; }
      25% { transform: translateY(10vh) translateX(20px) rotate(90deg); }
      50% { transform: translateY(40vh) translateX(-20px) rotate(180deg); }
      75% { transform: translateY(70vh) translateX(20px) rotate(270deg); }
      100% { transform: translateY(120vh) translateX(0) rotate(360deg); opacity: 0; }
    }
    .confetti-piece {
      position: absolute;
      top: -20px;
      animation: confetti-fall linear forwards;
      pointer-events: none;
      z-index: 50;
    }
    @keyframes shutter {
      0% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0; }
    }
    .shutter-flash {
      position: fixed;
      inset: 0;
      background: white;
      z-index: 100;
      pointer-events: none;
      animation: shutter 0.4s ease-out forwards;
    }
    
    /* Smooth transition for dodge */
    .dodge-transition {
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    /* Ensure inputs don't zoom on iOS */
    input {
      font-size: 16px !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
